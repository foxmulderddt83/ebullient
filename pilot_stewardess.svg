<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480" style="background:transparent">
  <defs>
    <!-- Skin tone gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FDDBB4"/>
      <stop offset="100%" style="stop-color:#F0C090"/>
    </linearGradient>
    <!-- Pilot uniform gradient - dark navy -->
    <linearGradient id="pilotUniform" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a4a"/>
      <stop offset="100%" style="stop-color:#0d1a30"/>
    </linearGradient>
    <!-- Stewardess uniform gradient - elegant red/maroon -->
    <linearGradient id="stewUniform" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B1A2A"/>
      <stop offset="100%" style="stop-color:#5c0f1a"/>
    </linearGradient>
    <!-- Cap gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3560"/>
      <stop offset="100%" style="stop-color:#0d1a30"/>
    </linearGradient>
    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#C8A000"/>
    </linearGradient>
    <!-- Shirt white -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0f4f8"/>
      <stop offset="100%" style="stop-color:#dde4ec"/>
    </linearGradient>
    <!-- Scarf red -->
    <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cc2233"/>
      <stop offset="100%" style="stop-color:#991122"/>
    </linearGradient>
    <!-- Skirt gradient -->
    <linearGradient id="skirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B1A2A"/>
      <stop offset="100%" style="stop-color:#6a1020"/>
    </linearGradient>
    <!-- Leg skin -->
    <linearGradient id="legSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FDDBB4"/>
      <stop offset="100%" style="stop-color:#e8b880"/>
    </linearGradient>
    <!-- Hair dark -->
    <linearGradient id="hairDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a0a"/>
      <stop offset="100%" style="stop-color:#1a0a00"/>
    </linearGradient>
    <!-- Stew hair bun -->
    <linearGradient id="hairBun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a2010"/>
      <stop offset="100%" style="stop-color:#1a0a00"/>
    </linearGradient>
    <!-- Shadow -->
    <filter id="dropShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.18)"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
  </defs>

  <!-- ===================== -->
  <!--       PILOT           -->
  <!-- ===================== -->
  <g transform="translate(108,30)" filter="url(#dropShadow)">

    <!-- LEGS -->
    <rect x="28" y="310" width="22" height="90" rx="8" fill="#1a2a4a"/>
    <rect x="58" y="310" width="22" height="90" rx="8" fill="#1a2a4a"/>
    <!-- Trouser crease -->
    <line x1="39" y1="315" x2="39" y2="395" stroke="#0d1a30" stroke-width="1.5" opacity="0.5"/>
    <line x1="69" y1="315" x2="69" y2="395" stroke="#0d1a30" stroke-width="1.5" opacity="0.5"/>
    <!-- Shoes -->
    <ellipse cx="39" cy="398" rx="16" ry="8" fill="#1a1a1a"/>
    <ellipse cx="69" cy="398" rx="16" ry="8" fill="#1a1a1a"/>
    <!-- Shoe shine -->
    <ellipse cx="33" cy="394" rx="6" ry="3" fill="#3a3a3a" opacity="0.5"/>
    <ellipse cx="63" cy="394" rx="6" ry="3" fill="#3a3a3a" opacity="0.5"/>

    <!-- BODY / JACKET -->
    <rect x="14" y="190" width="80" height="130" rx="14" fill="url(#pilotUniform)"/>
    <!-- Jacket lapels -->
    <path d="M 54,195 L 40,220 L 54,215 L 68,220 L 54,195 Z" fill="url(#shirtGrad)"/>
    <!-- White shirt visible -->
    <rect x="46" y="195" width="16" height="80" rx="3" fill="url(#shirtGrad)"/>
    <!-- Shirt buttons -->
    <circle cx="54" cy="220" r="2.5" fill="#ccc"/>
    <circle cx="54" cy="232" r="2.5" fill="#ccc"/>
    <circle cx="54" cy="244" r="2.5" fill="#ccc"/>

    <!-- TIE - dark navy -->
    <path d="M 50,215 L 54,270 L 58,215 L 56,208 L 52,208 Z" fill="#0d1a30"/>
    <path d="M 52,268 L 54,278 L 56,268 Z" fill="#0d1a30"/>
    <!-- Tie gold stripe -->
    <path d="M 52,230 L 56,230 L 55,235 L 53,235 Z" fill="url(#goldGrad)" opacity="0.8"/>

    <!-- EPAULETTES (shoulders) -->
    <!-- Left shoulder -->
    <rect x="10" y="192" width="26" height="10" rx="4" fill="url(#capGrad)"/>
    <line x1="14" y1="196" x2="32" y2="196" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="14" y1="199" x2="32" y2="199" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <!-- Right shoulder -->
    <rect x="72" y="192" width="26" height="10" rx="4" fill="url(#capGrad)"/>
    <line x1="76" y1="196" x2="94" y2="196" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="76" y1="199" x2="94" y2="199" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <!-- WINGS BADGE on chest -->
    <g transform="translate(30,210)">
      <!-- Wing left -->
      <path d="M 24,5 Q 10,2 0,5 Q 8,8 24,7 Z" fill="url(#goldGrad)"/>
      <!-- Wing right -->
      <path d="M 24,5 Q 38,2 48,5 Q 40,8 24,7 Z" fill="url(#goldGrad)"/>
      <!-- Center shield -->
      <path d="M 20,2 L 28,2 L 30,10 L 24,13 L 18,10 Z" fill="url(#goldGrad)"/>
      <path d="M 22,3 L 26,3 L 27,9 L 24,11 L 21,9 Z" fill="#1e3560"/>
      <!-- Star on shield -->
      <polygon points="24,4.5 24.8,7 27,7 25.5,8.3 26,10.5 24,9 22,10.5 22.5,8.3 21,7 23.2,7" 
               fill="url(#goldGrad)" transform="scale(0.55) translate(19,3)"/>
    </g>

    <!-- RANK STRIPES on sleeves -->
    <!-- Left sleeve stripes (4 gold = captain) -->
    <rect x="12" y="270" width="20" height="3" rx="1" fill="url(#goldGrad)"/>
    <rect x="12" y="276" width="20" height="3" rx="1" fill="url(#goldGrad)"/>
    <rect x="12" y="282" width="20" height="3" rx="1" fill="url(#goldGrad)"/>
    <rect x="12" y="288" width="20" height="3" rx="1" fill="url(#goldGrad)"/>
    <!-- Right sleeve stripes -->
    <rect x="76" y="270" width="20" height="3" rx="1" fill="url(#goldGrad)"/>
    <rect x="76" y="276" width="20" height="3" rx="1" fill="url(#goldGrad)"/>
    <rect x="76" y="282" width="20" height="3" rx="1" fill="url(#goldGrad)"/>
    <rect x="76" y="288" width="20" height="3" rx="1" fill="url(#goldGrad)"/>

    <!-- LEFT ARM - saluting (raised up to cap) -->
    <!-- Upper arm -->
    <path d="M 12,200 Q -15,185 -28,160" stroke="url(#pilotUniform)" stroke-width="22" 
          stroke-linecap="round" fill="none"/>
    <!-- Forearm going up to forehead -->
    <path d="M -28,160 Q -22,135 -10,120" stroke="url(#pilotUniform)" stroke-width="20" 
          stroke-linecap="round" fill="none"/>
    <!-- Hand at salute -->
    <ellipse cx="-10" cy="116" rx="12" ry="9" fill="url(#skinGrad)" transform="rotate(-30,-10,116)"/>
    <!-- Fingers hint -->
    <path d="M -18,112 L -4,108" stroke="#e0a878" stroke-width="2" stroke-linecap="round"/>
    <path d="M -16,116 L -2,112" stroke="#e0a878" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Sleeve stripe on saluting arm -->
    <path d="M -30,158 Q -20,140 -15,130" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>

    <!-- RIGHT ARM - relaxed at side -->
    <path d="M 95,205 Q 118,230 115,270" stroke="url(#pilotUniform)" stroke-width="22"
          stroke-linecap="round" fill="none"/>
    <!-- Right hand -->
    <ellipse cx="114" cy="278" rx="12" ry="10" fill="url(#skinGrad)"/>

    <!-- NECK -->
    <rect x="46" y="165" width="18" height="30" rx="7" fill="url(#skinGrad)"/>

    <!-- HEAD (no face - blank smooth) -->
    <ellipse cx="54" cy="148" rx="38" ry="42" fill="url(#skinGrad)"/>
    <!-- Head top flat for cap -->
    <rect x="24" y="110" width="60" height="20" rx="4" fill="url(#skinGrad)"/>

    <!-- EAR left -->
    <ellipse cx="18" cy="152" rx="7" ry="10" fill="url(#skinGrad)"/>
    <ellipse cx="18" cy="152" rx="4" ry="7" fill="#F0C090"/>
    <!-- EAR right -->
    <ellipse cx="90" cy="152" rx="7" ry="10" fill="url(#skinGrad)"/>
    <ellipse cx="90" cy="152" rx="4" ry="7" fill="#F0C090"/>

    <!-- PILOT CAP -->
    <!-- Cap brim -->
    <path d="M 10,126 Q 54,118 98,126 L 96,134 Q 54,128 12,134 Z" fill="#0d1a30"/>
    <!-- Cap body -->
    <path d="M 14,130 Q 14,105 54,100 Q 94,105 94,130 Q 74,126 54,126 Q 34,126 14,130 Z" fill="url(#capGrad)"/>
    <!-- Cap top button -->
    <circle cx="54" cy="100" r="4" fill="url(#goldGrad)"/>
    <!-- Cap gold band -->
    <rect x="14" y="124" width="80" height="6" rx="2" fill="url(#goldGrad)"/>
    <!-- Cap badge center -->
    <g transform="translate(38,107)">
      <path d="M 16,2 L 20,2 L 22,8 L 28,8 L 23,12 L 25,18 L 16,14 L 7,18 L 9,12 L 4,8 L 10,8 Z" 
            fill="url(#goldGrad)" transform="scale(0.7)"/>
      <circle cx="11" cy="9" r="5" fill="#1e3560" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <circle cx="11" cy="9" r="3" fill="url(#goldGrad)"/>
    </g>

    <!-- HAIR sideburns -->
    <rect x="17" y="140" width="8" height="20" rx="3" fill="url(#hairDark)"/>
    <rect x="83" y="140" width="8" height="20" rx="3" fill="url(#hairDark)"/>

  </g>

  <!-- ===================== -->
  <!--     STEWARDESS        -->
  <!-- ===================== -->
  <g transform="translate(285,50)" filter="url(#dropShadow)">

    <!-- LEGS with stockings -->
    <rect x="28" y="290" width="19" height="85" rx="7" fill="url(#legSkin)"/>
    <rect x="55" y="290" width="19" height="85" rx="7" fill="url(#legSkin)"/>
    <!-- Stocking seam hint -->
    <line x1="37" y1="295" x2="37" y2="372" stroke="#d4a070" stroke-width="0.8" opacity="0.4"/>
    <line x1="64" y1="295" x2="64" y2="372" stroke="#d4a070" stroke-width="0.8" opacity="0.4"/>
    <!-- Heels -->
    <path d="M 24,372 Q 30,368 38,370 L 40,380 Q 34,385 26,382 Z" fill="#2a1a0a"/>
    <path d="M 51,372 Q 57,368 65,370 L 67,380 Q 61,385 53,382 Z" fill="#2a1a0a"/>
    <!-- Heel point -->
    <rect x="26" y="380" width="4" height="8" rx="1" fill="#2a1a0a"/>
    <rect x="53" y="380" width="4" height="8" rx="1" fill="#2a1a0a"/>

    <!-- SKIRT (A-line pencil skirt) -->
    <path d="M 12,230 Q 10,280 14,295 Q 51,300 88,295 Q 92,280 90,230 Z" fill="url(#skirtGrad)"/>
    <!-- Skirt highlight -->
    <path d="M 20,235 Q 18,270 20,285 Q 35,290 50,290 Q 40,270 38,235 Z" fill="white" opacity="0.06"/>

    <!-- BODY / JACKET BLAZER -->
    <rect x="14" y="148" width="74" height="90" rx="12" fill="url(#stewUniform)"/>
    <!-- Blazer lapels V-shape -->
    <path d="M 51,155 L 36,178 L 51,172 L 66,178 L 51,155 Z" fill="url(#shirtGrad)"/>
    <!-- White blouse visible -->
    <rect x="44" y="155" width="14" height="65" rx="3" fill="url(#shirtGrad)"/>

    <!-- SCARF / NECK TIE elegant -->
    <path d="M 43,168 Q 51,185 59,168 Q 57,162 51,160 Q 45,162 43,168 Z" fill="url(#scarfGrad)"/>
    <!-- Scarf knot -->
    <ellipse cx="51" cy="167" rx="7" ry="5" fill="#cc2233"/>
    <ellipse cx="51" cy="167" rx="4" ry="3" fill="#dd3344"/>

    <!-- EPAULETTES - stewardess style -->
    <rect x="10" y="150" width="22" height="8" rx="3" fill="#6a1020"/>
    <line x1="13" y1="153" x2="28" y2="153" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <rect x="70" y="150" width="22" height="8" rx="3" fill="#6a1020"/>
    <line x1="73" y1="153" x2="88" y2="153" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <!-- BREAST POCKET with small wings pin -->
    <rect x="56" y="165" width="20" height="14" rx="2" fill="#6a1020" opacity="0.6"/>
    <path d="M 66,169 Q 58,167 54,170 Q 60,172 66,172 Q 72,172 78,170 Q 74,167 66,169 Z" fill="url(#goldGrad)" transform="scale(0.65) translate(36,95)"/>

    <!-- LEFT ARM - holding tray / relaxed forward -->
    <path d="M 12,158 Q -8,175 -15,210" stroke="url(#stewUniform)" stroke-width="20"
          stroke-linecap="round" fill="none"/>
    <!-- Forearm holding tray -->
    <path d="M -15,210 Q -18,235 -15,255" stroke="url(#stewUniform)" stroke-width="18"
          stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <ellipse cx="-14" cy="262" rx="11" ry="9" fill="url(#skinGrad)"/>
    <!-- Tray -->
    <ellipse cx="-14" cy="258" rx="22" ry="6" fill="#e8d090" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <!-- Item on tray (small cup) -->
    <rect x="-22" y="248" width="10" height="10" rx="2" fill="white" stroke="#ccc" stroke-width="1"/>
    <ellipse cx="-17" cy="248" rx="5" ry="2" fill="#f0f0f0"/>

    <!-- RIGHT ARM - relaxed at side -->
    <path d="M 86,162 Q 105,185 102,220" stroke="url(#stewUniform)" stroke-width="20"
          stroke-linecap="round" fill="none"/>
    <!-- Right hand -->
    <ellipse cx="101" cy="228" rx="11" ry="9" fill="url(#skinGrad)"/>

    <!-- NECK -->
    <rect x="44" y="128" width="14" height="28" rx="6" fill="url(#skinGrad)"/>

    <!-- HEAD (no face - smooth) -->
    <ellipse cx="51" cy="108" rx="34" ry="38" fill="url(#skinGrad)"/>
    <!-- Head top -->
    <rect x="24" y="74" width="54" height="18" rx="6" fill="url(#skinGrad)"/>

    <!-- EAR left -->
    <ellipse cx="19" cy="112" rx="6" ry="9" fill="url(#skinGrad)"/>
    <ellipse cx="19" cy="112" rx="3.5" ry="6" fill="#F0C090"/>
    <!-- Earring -->
    <circle cx="19" cy="120" r="3" fill="url(#goldGrad)"/>
    <!-- EAR right -->
    <ellipse cx="83" cy="112" rx="6" ry="9" fill="url(#skinGrad)"/>
    <ellipse cx="83" cy="112" rx="3.5" ry="6" fill="#F0C090"/>
    <!-- Earring right -->
    <circle cx="83" cy="120" r="3" fill="url(#goldGrad)"/>

    <!-- HAIR elegant updo bun -->
    <!-- Hair sides -->
    <path d="M 20,95 Q 17,75 30,65 Q 51,55 72,65 Q 85,75 82,95 Q 70,85 51,83 Q 32,85 20,95 Z"
          fill="url(#hairBun)"/>
    <!-- Top bun -->
    <ellipse cx="51" cy="65" rx="22" ry="16" fill="url(#hairBun)"/>
    <!-- Bun detail lines -->
    <path d="M 35,62 Q 51,57 67,62" stroke="#3a2010" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M 32,68 Q 51,63 70,68" stroke="#3a2010" stroke-width="1" fill="none" opacity="0.4"/>
    <!-- Hair pin / accessory -->
    <rect x="62" y="58" width="16" height="4" rx="2" fill="url(#goldGrad)" transform="rotate(-25,62,60)"/>

    <!-- STEWARDESS HAT - small pillbox hat -->
    <ellipse cx="51" cy="68" rx="26" ry="8" fill="url(#stewUniform)"/>
    <ellipse cx="51" cy="65" rx="22" ry="6" fill="url(#stewUniform)"/>
    <rect x="29" y="59" width="44" height="10" rx="2" fill="url(#stewUniform)"/>
    <!-- Hat brim line -->
    <ellipse cx="51" cy="70" rx="26" ry="5" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <!-- Hat badge small -->
    <ellipse cx="51" cy="63" rx="7" ry="5" fill="#6a1020" stroke="url(#goldGrad)" stroke-width="1"/>
    <path d="M 51,60 L 52,63 L 55,63 L 53,65 L 54,68 L 51,66 L 48,68 L 49,65 L 47,63 L 50,63 Z"
          fill="url(#goldGrad)" transform="scale(0.45) translate(62,90)"/>

  </g>

  <!-- ========================= -->
  <!--   GROUND / BASE LINE      -->
  <!-- ========================= -->
  <ellipse cx="155" cy="455" rx="80" ry="10" fill="rgba(0,0,0,0.08)"/>
  <ellipse cx="365" cy="455" rx="75" ry="10" fill="rgba(0,0,0,0.08)"/>

  <!-- ========================= -->
  <!--   DECORATIVE ELEMENTS     -->
  <!-- ========================= -->
  <!-- Small airline logo / badge between them -->
  <g transform="translate(230,180)">
    <circle cx="30" cy="30" r="28" fill="#1a2a4a" opacity="0.9"/>
    <circle cx="30" cy="30" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Airplane icon -->
    <path d="M 20,30 L 30,20 L 40,30 L 36,30 L 36,40 L 30,38 L 24,40 L 24,30 Z" 
          fill="url(#goldGrad)" opacity="0.9" transform="rotate(-45,30,30) scale(0.7) translate(13,13)"/>
    <path d="M 18,30 Q 30,24 42,30 Q 30,26 18,30 Z" fill="url(#goldGrad)"/>
    <path d="M 26,22 L 34,22 L 30,15 Z" fill="url(#goldGrad)"/>
    <path d="M 26,38 L 28,42 L 32,42 L 34,38" fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Stars decorative -->
  <circle cx="210" cy="100" r="3" fill="url(#goldGrad)" opacity="0.6"/>
  <circle cx="310" cy="85" r="2" fill="url(#goldGrad)" opacity="0.5"/>
  <circle cx="195" cy="140" r="2" fill="url(#goldGrad)" opacity="0.4"/>

  <!-- Salute motion lines -->
  <path d="M 68,90 Q 75,85 82,82" stroke="url(#goldGrad)" stroke-width="2" fill="none" 
        stroke-linecap="round" opacity="0.5"/>
  <path d="M 66,98 Q 74,94 82,92" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" 
        stroke-linecap="round" opacity="0.35"/>

</svg>
