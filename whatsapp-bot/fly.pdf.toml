# fly.toml app configuration file for PDF Generation Service
app = "oneday-pdf-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.pdf"

[env]
  TZ = "Asia/Singapore"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
