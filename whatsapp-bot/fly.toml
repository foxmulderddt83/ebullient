# fly.toml app configuration file generated for oneday-whatsapp-bot on 2026-04-01T06:27:33+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'oneday-whatsapp-bot'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile.pdf'

[env]
  TZ = 'Asia/Singapore'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "get"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
