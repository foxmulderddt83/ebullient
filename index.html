<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content-Security-Policy is served as an HTTP header, not here:
         public/.htaccess on cPanel, vercel.json on Vercel. The <meta> form
         cannot express frame-ancestors, and the policy that used to live
         here allowed `default-src *` and `script-src *`, which is close to
         no policy at all. Two competing policies also made breakage hard to
         attribute, since the browser enforces the intersection of both. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="site-title">OneDayPilot | Fly a Real Plane in KL | Subang Airport Experience</title>
    <meta
      id="site-description"
      name="description"
      content="Fly a real aircraft over Kuala Lumpur from Subang Airport — no license needed. 30-min or 60-min flights with certified instructor. From RM749. Perfect for gifts, proposals & bridal shoots. Book online today."
    />
    <meta
      name="keywords"
      content="one day pilot malaysia, fly a plane kl, flight experience subang, pilot for a day malaysia, introductory flight malaysia, airplane joyride kuala lumpur, flying experience gift malaysia, bridal shoot aircraft malaysia, scenic flight kl subang airport"
    />
    <link rel="canonical" href="https://onedaypilot.com/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Security: DNS Prefetch for third-party CDNs -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">

    <!-- Preload first hero image for faster LCP (Largest Contentful Paint) -->
    <link rel="preload" as="image" href="/src/assets/hero-1.jpg" media="(min-width: 0px)">

    <!-- Supabase is on the critical path: every page's first paint waits on a
         query, and that query cannot start until vendor-supabase.js has
         downloaded and parsed. Opening the connection here runs DNS, TCP and
         TLS in parallel with the JS download instead of after it.
         This replaces a `dns-prefetch` on "https://*.supabase.co" — wildcards
         are not valid in a resource hint, so that line resolved nothing. -->
    <link rel="preconnect" href="https://kjukdoqkunuifiorcdpz.supabase.co" crossorigin>

    <!-- Security: Do Not Track for third-party embeds -->
    <meta name="dnt" content="on">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Core fonts: Poppins, Montserrat, Barlow Condensed.
         Loaded async so page can paint while fonts download. `display=swap`
         shows fallback immediately, then swaps the real font in. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Montserrat:wght@600;700&family=Barlow+Condensed:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Montserrat:wght@600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" media="print" onload="this.media='all'">

    <!-- Display fonts: Playfair, Cormorant, Bebas Neue (async load, non-critical) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Cormorant+Garamond:ital,wght@0,400;0,700&family=Bebas+Neue&display=swap" media="(prefers-reduced-motion: no-preference)">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Cormorant+Garamond:ital,wght@0,400;0,700&family=Bebas+Neue&display=swap" media="print" onload="this.media='all'">

    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Montserrat:wght@600;700&family=Barlow+Condensed:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700&family=Cormorant+Garamond:ital,wght@0,400;0,700&family=Bebas+Neue&display=fallback">
    </noscript>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_MY" />
    <meta id="og-url" property="og:url" content="https://onedaypilot.com/" />
    <meta id="og-title" property="og:title" content="OneDayPilot | Fly a Real Plane in KL | From RM749" />
    <meta
      id="og-description"
      property="og:description"
      content="Fly a real aircraft over KL from Subang Airport. 30-min or 60-min experience. No license needed. Certified instructor. From RM749."
    />
    <meta id="og-image" property="og:image" content="https://onedaypilot.com/banner_experience.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta id="twitter-url" name="twitter:url" content="https://onedaypilot.com/" />
    <meta id="twitter-title" name="twitter:title" content="OneDayPilot | Fly a Real Plane in KL | From RM749" />
    <meta
      id="twitter-description"
      name="twitter:description"
      content="30-min scenic flight over KL from Subang Airport. No license needed. From RM749."
    />
    <meta id="twitter-image" name="twitter:image" content="https://onedaypilot.com/banner_experience.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["LocalBusiness", "TouristAttraction", "SportsActivityLocation"],
        "name": "OneDayPilot",
        "description": "Fly a real aircraft over Kuala Lumpur from Subang Airport. Introductory flights with certified instructor. No license needed.",
        "url": "https://onedaypilot.com",
        "logo": "https://onedaypilot.com/logo.png",
        "image": "https://onedaypilot.com/banner_experience.png",
        "telephone": "+601165127889",
        "email": "booking@onedaypilot.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Aerotree Flight Services, Hangar 2, SAAS International Airport",
          "addressLocality": "Subang",
          "addressRegion": "Selangor",
          "postalCode": "47200",
          "addressCountry": "MY"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 3.1302,
          "longitude": 101.5496
        },
        "priceRange": "RM749–RM1499",
        "currenciesAccepted": "MYR",
        "sameAs": [
          "https://www.facebook.com/onedaypilot/",
          "https://www.klook.com/en-MY/activity/54083-kuala-lumpur-flight-experience/"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Polyfill for global which is needed by some older libraries (like quill-image-resize-module-react)
      window.global = window;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
